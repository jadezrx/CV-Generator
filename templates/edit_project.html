<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modifier le projet</title>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>

  <h1>Modifier le projet</h1>
  <p class="page-sub">{{ project.name_project or "" }}</p>

  <div class="card">
    <form action="/projects/{{ project.id }}/update" method="post">
      <div class="form-grid two">
        <div class="field"><label>Nom du projet</label><input name="name_project" value="{{ project.name_project or '' }}" placeholder=" "/></div>
        <div class="field"><label>Lien</label><input name="link" value="{{ project.link or '' }}" placeholder=" "/></div>
        <div class="field full"><label>Description</label><textarea name="description" rows="3" placeholder=" ">{{ project.description or '' }}</textarea></div>
      </div>
      <button type="submit" class="btn-add">Enregistrer</button>
    </form>
  </div>

  <div style="text-align:center;margin-top:2rem">
    <a href="/" style="display:inline-block;padding:0.9rem 2.5rem;background:#2e2e2e;color:#fff;border-radius:10px;font-family:var(--font);font-size:0.9rem;text-decoration:none">
      ← Retour au portfolio
    </a>
  </div>

</body>
</html>
